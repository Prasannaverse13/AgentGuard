[package]
name = "agentguard-vault"
version = "0.1.0"
edition = "2021"
description = "AgentGuard vault: a NEAR contract that lets AI agents spend inside owner rules"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
