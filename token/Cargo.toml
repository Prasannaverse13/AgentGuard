[package]
name = "test-usdc"
version = "0.1.0"
edition = "2021"
description = "Free test USDC for AgentGuard on NEAR testnet. Anyone can mint. Never use on mainnet."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
